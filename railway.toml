[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Restart container if the process dies
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 100000
# Long-polling bot — no HTTP health path
healthcheckPath = ""
# Single replica only (two instances → Telegram 409 conflict)
numReplicas = 1
